version: "3.9"

services:
  # ──────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: fleet_postgres
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_secret
      POSTGRES_DB: fleetdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fleet_mqtt
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping", "-q", "0"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Backend (Rust / Axum)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet_backend
    environment:
      DATABASE_URL: postgres://fleet:fleet_secret@postgres:5432/fleetdb
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SERVER_PORT: "8080"
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Simulator (Rust)
  # ──────────────────────────────────────────
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet_simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      RUST_LOG: info
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Frontend (React / Vite)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: fleet_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
